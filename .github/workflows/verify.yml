name: Verify code and published evidence

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install analysis environment
        run: python -m pip install -r requirements-analysis.txt
      - name: Reproduce published statistics without model dependencies
        run: python -m experiments.evidence_bundle verify
      - name: Reproduce figures without raw logs
        env:
          MPLBACKEND: Agg
        run: python -m experiments.visualize --output-dir "$RUNNER_TEMP/pruning-figures"
      - name: Install CPU model dependencies for tiny offline tests
        run: |
          python -m pip install 'torch==2.11.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers==5.15.0'
      - name: Test and compile
        run: |
          python -m pytest -q
          python -m compileall -q src experiments tests
